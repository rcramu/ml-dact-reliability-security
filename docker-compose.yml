services:
  postgres:
    image: postgres:16-alpine
    container_name: cmp_postgres
    environment:
      POSTGRES_USER: cmp_user
      POSTGRES_PASSWORD: cmp_pass
      POSTGRES_DB: churn_platform
    volumes:
      - cmp_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5480:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp_user -d churn_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: cmp_mlflow
    working_dir: /mlflow
    command: >
      bash -c "pip install psycopg2-binary >/dev/null 2>&1 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts"
    volumes:
      - cmp_mlflow_data:/mlflow
    ports:
      - "5030:5000"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cmp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cmp_minio
      MINIO_ROOT_PASSWORD: cmp_minio_secret
    volumes:
      - cmp_minio_data:/data
    ports:
      - "9370:9000"
      - "9371:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  splunk:
    image: splunk/splunk:9.2
    platform: linux/amd64
    container_name: cmp_splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ChurnPlatform!2026
      SPLUNK_HEC_TOKEN: "22222222-2222-2222-2222-222222222222"
    volumes:
      - cmp_splunk_data:/opt/splunk/var
    ports:
      - "8370:8000"
      - "8371:8088"
      - "8372:8089"
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8089/services/server/info"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: cmp_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4370:4317"
      - "4371:4318"
    depends_on:
      - splunk
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cmp_prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cmp_prometheus_data:/prometheus
    ports:
      - "9300:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cmp_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cmp_grafana_data:/var/lib/grafana
    ports:
      - "3370:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmp_backend
    env_file:
      - .env
    environment:
      CMP_DATABASE_URL: postgresql+psycopg2://cmp_user:cmp_pass@postgres:5432/churn_platform
      CMP_MLFLOW_TRACKING_URI: http://mlflow:5000
      CMP_S3_ENDPOINT_URL: http://minio:9000
      CMP_SPLUNK_HEC_URL: https://splunk:8088/services/collector
      CMP_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8170:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmp_frontend
    ports:
      - "3070:80"
    depends_on:
      - backend
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.10.3-python3.11
    container_name: cmp_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cmp_user:cmp_pass@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: churnplatform-dev-secret-key
      _PIP_ADDITIONAL_REQUIREMENTS: "requests==2.32.3"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.10.3-python3.11
    container_name: cmp_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8770:8080"
    command: webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    image: apache/airflow:2.10.3-python3.11
    container_name: cmp_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler
    restart: unless-stopped

volumes:
  cmp_pg_data:
  cmp_mlflow_data:
  cmp_minio_data:
  cmp_splunk_data:
  cmp_prometheus_data:
  cmp_grafana_data:
